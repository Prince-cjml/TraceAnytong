[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceanytong-watermark-worker"
version = "0.1.0"
description = "Forensic watermark carrier and evidence worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
